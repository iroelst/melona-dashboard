<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melona Auto System Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        :root {
            --bg-dark: #0a0c0e;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-green: #39ff14;
            --accent-blue: #00d4ff;
            --accent-red: #ff4136;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, #1a2e1a, transparent);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: 110px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .label-sm { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .glow-green { color: var(--accent-green); text-shadow: 0 0 10px rgba(57, 255, 20, 0.3); }
        .glow-blue { color: var(--accent-blue); text-shadow: 0 0 10px rgba(0, 212, 255, 0.3); }
        
        .status-badge { border-radius: 50px; font-size: 0.8rem; }
        .text-green { color: var(--accent-green) !important; }
        .text-red { color: var(--accent-red) !important; }

        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 450px; background: rgba(15, 18, 20, 0.9);
            backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 35px; display: flex; justify-content: space-around;
            padding: 12px; z-index: 1000;
        }

        .nav-item { color: #555; font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--accent-green); }
        .hidden { display: none; }
        
        /* Animasi Maintenance */
        .bg-red-soft { background: rgba(255, 65, 54, 0.1) !important; border: 1px solid var(--accent-red); color: var(--accent-red); }
    </style>
</head>
<body>

    <div class="container pt-4">
        <header class="d-flex justify-content-between align-items-center mb-4 px-2">
            <div>
                <h4 class="fw-bold mb-0" id="brand-text">Melona <span class="text-green">System</span></h4>
                <small class="text-secondary" id="display-date">Memuat...</small>
            </div>
            <div class="glass-card py-1 px-3 status-badge">
                <small id="mqtt-status" class="fw-bold text-secondary">Connecting...</small>
            </div>
        </header>

        <div id="page-dashboard">
            <div id="maintenance-banner" class="alert bg-red-soft hidden mb-4 text-center fw-bold">
                <i class="bi bi-tools"></i> MODE MAINTENANCE: SISTEM OFF
            </div>
            
            <div class="row g-3">
                <div class="col-6">
                    <div class="glass-card text-center">
                        <span class="label-sm">Usia Tanaman</span>
                        <div class="display-5 fw-bold mt-1"><span id="hst-val">--</span><small class="fs-6 text-secondary">HST</small></div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="glass-card text-center">
                        <span class="label-sm">Suhu GH</span>
                        <div class="display-5 fw-bold mt-1"><span id="tgh-val">--</span><small class="fs-6 text-secondary">°C</small></div>
                        <div class="progress mt-2" style="height: 4px; background: #222;">
                        </div>
                    </div>
                </div>

                <div class="col-6">
    <div class="glass-card text-center">
        <span class="label-sm">Nutrisi (PPM)</span>
        <div class="h2 fw-bold glow-green mt-1" id="ppm-val">--</div>
        <div class="mt-2 pt-2 border-top border-secondary">
            <span class="target-label text-secondary">TARGET: </span>
            <span class="fw-bold text-white" id="target-ppm-val">--</span>
        </div>
    </div>
</div>

<div class="col-6">
    <div class="glass-card text-center">
        <span class="label-sm">Tingkat pH</span>
        <div class="h2 fw-bold glow-blue mt-1" id="ph-val">--</div>
        <div class="mt-2 pt-2 border-top border-secondary">
            <span class="target-label text-secondary">TARGET: </span>
            <span class="fw-bold text-white" id="target-ph-val">--</span>
        </div>
    </div>
</div>

                <div class="col-6">
                    <div class="glass-card border-start border-warning border-3">
                        <span class="label-sm text-warning">Suhu Air</span>
                        <div class="h4 fw-bold mt-1" id="tair-val">--°C</div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="glass-card border-start border-info border-3">
                        <span class="label-sm text-info">Humidity</span>
                        <div class="h4 fw-bold mt-1" id="hum-val">--%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12">
    <div class="glass-card d-flex justify-content-between align-items-center">
        <span class="label-sm">Status Pompa:</span>
        <div id="dosing-status" class="badge bg-secondary">STANDBY</div>
    </div>
</div>

    <nav class="bottom-nav">
        <div class="nav-item active"><i class="bi bi-grid-1x2-fill"></i></div>
        <div class="nav-item"><i class="bi bi-sliders"></i></div>
    </nav>

    <script>
        // KONFIGURASI SESUAI SCREENSHOT ANDA
        const CONFIG = {
            host: "k1e11691.ala.asia-southeast1.emqxsl.com",
            port: 8084, // WebSocket SSL Port
            user: "melona_admin",
            pass: "melona123",
            topic: "melona/telemetry"
        };

        const client = new Paho.MQTT.Client(CONFIG.host, CONFIG.port, "Client_" + Math.random().toString(16).substr(2, 8));

        client.onConnectionLost = (responseObject) => {
            document.getElementById('mqtt-status').innerText = "Disconnected";
            document.getElementById('mqtt-status').className = "fw-bold text-red";
            setTimeout(connectMQTT, 5000);
        };

        client.onMessageArrived = (message) => {
            const data = JSON.parse(message.payloadString);
            
            // Update UI Berdasarkan JSON dari ESP32
            document.getElementById('hst-val').innerText = data.hst;
            document.getElementById('ppm-val').innerText = data.ppm;
            document.getElementById('ph-val').innerText = data.ph.toFixed(1);
            document.getElementById('tgh-val').innerText = data.t_gh;
            document.getElementById('tair-val').innerText = data.t_air + "°C";
            document.getElementById('hum-val').innerText = data.h_gh + "%";
            
            // Progress bar suhu
            document.getElementById('tgh-bar').style.width = (data.t_gh / 50 * 100) + "%";

            // Logika Indikator Maintenance
            const banner = document.getElementById('maintenance-banner');
            const brand = document.getElementById('brand-text');
            if (data.sys === "OFF") {
                banner.classList.remove('hidden');
                brand.innerHTML = 'Melona <span class="text-red">Offline</span>';
            } else {
                banner.classList.add('hidden');
                brand.innerHTML = 'Melona <span class="text-green">System</span>';
            }
        };

        function connectMQTT() {
            client.connect({
                useSSL: true,
                userName: CONFIG.user,
                password: CONFIG.pass,
                onSuccess: () => {
                    client.subscribe(CONFIG.topic);
                    document.getElementById('mqtt-status').innerText = "Online ●";
                    document.getElementById('mqtt-status').className = "fw-bold text-green";
                }
            });
        }

        window.onload = () => {
            document.getElementById('display-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
            connectMQTT();
        };
    </script>
</body>

</html>
